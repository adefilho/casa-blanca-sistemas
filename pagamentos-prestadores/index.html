<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa Blanca — Pagamentos a Prestadores</title>
<style>
  :root{
    --brand:#0f766e;
    --brand-dark:#0b4f4a;
    --brand-light:#ccfbf1;
    --bg:#f1f5f9;
    --card-bg:#ffffff;
    --text:#1e293b;
    --muted:#64748b;
    --border:#e2e8f0;
    --pos:#15803d;
    --pos-bg:#dcfce7;
    --neg:#dc2626;
    --neg-bg:#fee2e2;
    --radius:10px;
    --shadow:0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  header.topbar{background:linear-gradient(135deg,var(--brand-dark),var(--brand));color:#fff;padding:18px 28px;box-shadow:var(--shadow);}
  .topbar-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;max-width:1300px;margin:0 auto;}
  .brand h1{margin:0;font-size:20px;font-weight:700;}
  .brand p{margin:2px 0 0;font-size:13px;opacity:.85;}
  .topbar-actions{display:flex;gap:8px;align-items:center;}
  .who{font-size:13px;opacity:.9;}
  .icon-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px;}
  .icon-btn:hover{background:rgba(255,255,255,.25);}

  nav.tabs{display:flex;gap:6px;max-width:1300px;margin:16px auto 0;padding:0 28px;flex-wrap:wrap;}
  .tab-btn{background:#fff;border:1px solid var(--border);color:var(--muted);padding:10px 18px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600;transition:.15s;}
  .tab-btn:hover{border-color:var(--brand);color:var(--brand);}
  .tab-btn.active{background:var(--brand);border-color:var(--brand);color:#fff;}

  main{max-width:1300px;margin:0 auto;padding:20px 28px 60px;}
  section.tab-panel{display:none;}
  section.tab-panel.active{display:block;}

  .btn{background:var(--brand);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
  .btn:hover{background:var(--brand-dark);}
  .btn.secondary{background:#fff;color:var(--brand);border:1px solid var(--brand);}
  .btn.secondary:hover{background:var(--brand-light);}
  .btn.danger{background:#fff;color:var(--neg);border:1px solid var(--neg);}
  .btn.danger:hover{background:var(--neg-bg);}
  .btn.small{padding:6px 12px;font-size:12.5px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  form .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;background:#fff;padding:20px;border-radius:var(--radius);box-shadow:var(--shadow);}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:13px;font-weight:600;color:var(--text);}
  .field .hint{font-size:12px;color:var(--muted);font-weight:400;}
  .field input, .field select, .field textarea{padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--text);}
  .field textarea{resize:vertical;min-height:60px;}
  .form-actions{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end;}
  .success-banner{background:var(--pos-bg);border:1px solid var(--pos);color:#14532d;padding:14px 18px;border-radius:var(--radius);margin-bottom:16px;display:none;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .success-banner.show{display:flex;}
  .error-banner{background:var(--neg-bg);border:1px solid var(--neg);color:#7f1d1d;padding:10px 14px;border-radius:8px;margin-top:10px;font-size:13.5px;display:none;}
  .error-banner.show{display:block;}

  .metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px;}
  .metric-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;text-align:center;}
  .metric-card .val{font-size:24px;font-weight:800;color:var(--brand-dark);}
  .metric-card .lbl{font-size:12.5px;color:var(--muted);margin-top:4px;}

  .filters-card{background:#fff;padding:16px;border-radius:var(--radius);box-shadow:var(--shadow);display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
  .filters-card .field{min-width:150px;}

  table.report-table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
  table.report-table th, table.report-table td{padding:10px 12px;font-size:13px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top;}
  table.report-table th{background:var(--bg);color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;}
  table.report-table tr:last-child td{border-bottom:none;}
  table.report-table tr.subtotal td{background:#f8fafc;font-weight:700;}
  .val-pos{color:var(--pos);font-weight:700;}
  .val-neg{color:var(--neg);}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--muted);background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);}
  .empty-state .big{font-size:36px;margin-bottom:8px;}

  /* LOGIN */
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--brand-dark),var(--brand));padding:20px;}
  .login-card{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.25);padding:36px 32px;width:100%;max-width:380px;text-align:center;}
  .login-card img{width:120px;margin-bottom:14px;}
  .login-card h2{margin:0 0 4px;font-size:18px;color:var(--brand-dark);}
  .login-card p.sub{margin:0 0 22px;font-size:13px;color:var(--muted);}
  .login-card .field{text-align:left;margin-bottom:14px;}
  .login-card .field input{width:100%;text-transform:uppercase;}
  .login-card .btn{width:100%;padding:12px;font-size:15px;}

  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .badge.pagador-Proprietario{background:#dbeafe;color:#2563eb;}
  .badge.pagador-Locatario{background:#fef3c7;color:#b45309;}
  .badge.pagador-Imobiliaria{background:var(--brand-light);color:var(--brand);}

  .role-chip{background:rgba(255,255,255,.2);padding:4px 10px;border-radius:999px;font-size:12px;}

  @media (max-width:700px){
    form .form-grid{grid-template-columns:1fr;}
  }
  #receiptPrintArea{position:fixed;top:0;left:0;width:0;height:0;overflow:hidden;}
  .recibo-box{font-family:'Times New Roman',Times,serif;color:#111;border:1px solid #000;padding:24px 30px;max-width:720px;margin:0 auto;}
  .recibo-box .r-header{display:flex;align-items:center;gap:16px;margin-bottom:18px;}
  .recibo-box img{width:90px;}
  .recibo-box h1{font-size:17px;text-decoration:underline;margin:0;flex:1;text-align:center;}
  .recibo-box p{font-size:14px;line-height:1.6;text-align:justify;}
  .recibo-box .data-linha{margin-top:26px;text-align:center;}
  .recibo-box .assinatura{margin-top:70px;text-align:center;}
  .recibo-box .linha{border-top:1px solid #000;width:380px;margin:0 auto;}
  @media print{
    body *{visibility:hidden;}
    #receiptPrintArea, #receiptPrintArea *{visibility:visible;}
    #receiptPrintArea{position:absolute;top:0;left:0;width:100%;height:auto;padding:30px;}
    .no-print{display:none !important;}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <h2>🏠 Casa Blanca Imobiliária</h2>
    <p class="sub">Pagamentos a Prestadores</p>
    <form id="loginForm">
      <div class="field">
        <label>Usuário</label>
        <input type="text" id="l_usuario" required autocomplete="username">
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="l_senha" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn">Entrar</button>
      <div class="error-banner" id="loginError"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div id="appScreen" style="display:none;">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>💵 Pagamentos a Prestadores</h1>
        <p>Casa Blanca Imobiliária · Iguatu-CE</p>
      </div>
      <div class="topbar-actions">
        <span class="who">Olá, <b id="whoName"></b> <span class="role-chip" id="whoRole"></span></span>
        <button class="icon-btn" onclick="doLogout()">Sair</button>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabsNav">
    <button class="tab-btn active" data-tab="lancar" onclick="switchTab('lancar')">➕ Lançar Saída</button>
    <button class="tab-btn" data-tab="meus" onclick="switchTab('meus')">📋 Meus Lançamentos</button>
    <button class="tab-btn admin-only" data-tab="relatorio" onclick="switchTab('relatorio')" style="display:none;">📊 Relatório</button>
    <button class="tab-btn admin-only" data-tab="equipe" onclick="switchTab('equipe')" style="display:none;">👥 Equipe</button>
  </nav>

  <main>
    <!-- LANÇAR -->
    <section class="tab-panel active" id="tab-lancar">
      <div class="success-banner" id="successBanner">
        <span id="successText"></span>
        <button class="btn secondary small" onclick="dismissSuccess()">Fechar</button>
      </div>
      <form class="form-grid" id="lancForm">
        <input type="hidden" id="editingId" value="">
        <div class="field">
          <label>Prestador *</label>
          <input type="text" id="f_prestador" required list="prestadoresList" placeholder="Nome do prestador">
          <datalist id="prestadoresList"></datalist>
        </div>
        <div class="field">
          <label>Imóvel / Endereço</label>
          <input type="text" id="f_imovel" placeholder="Endereço do imóvel (deixe em branco se não for específico de um imóvel)">
        </div>
        <div class="field">
          <label>Pagador *</label>
          <select id="f_pagador" required>
            <option value="Proprietario">Proprietário</option>
            <option value="Locatario">Locatário</option>
            <option value="Imobiliaria">Imobiliária</option>
          </select>
        </div>
        <div class="field">
          <label>Nome do Proprietário/Locatário</label>
          <input type="text" id="f_pagadorNome" placeholder="Deixe em branco se o pagador for a Imobiliária">
        </div>
        <div class="field">
          <label>Data do serviço *</label>
          <input type="date" id="f_data" required>
        </div>
        <div class="field">
          <label>Valor pago ao prestador (R$) *</label>
          <input type="number" step="0.01" min="0" id="f_valorPago" required placeholder="Ex: 100,00">
        </div>
        <div class="field">
          <label>Valor cobrado do cliente (R$) *</label>
          <input type="number" step="0.01" min="0" id="f_valorCobrado" required placeholder="Ex: 130,00">
        </div>
        <div class="field full">
          <label>Descrição do serviço *</label>
          <textarea id="f_descricao" required placeholder="Ex: Retelhamento e retirada de vazamento do banheiro"></textarea>
        </div>
        <div class="field full">
          <label>Descrição para a Nota de Serviço <span class="hint">(opcional — deixe em branco para usar a mesma descrição acima)</span></label>
          <textarea id="f_descricaoNota" placeholder="Só preencha se a nota de serviço precisar de um texto diferente do recibo"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn secondary" onclick="resetLancForm()">Cancelar</button>
          <button type="submit" class="btn" id="submitBtn">Registrar Saída</button>
        </div>
      </form>
    </section>

    <!-- MEUS LANÇAMENTOS -->
    <section class="tab-panel" id="tab-meus">
      <div id="meusLancamentosBody"></div>
    </section>

    <!-- RELATÓRIO (admin) -->
    <section class="tab-panel" id="tab-relatorio">
      <div class="filters-card">
        <div class="field">
          <label>De</label>
          <input type="date" id="rel_de">
        </div>
        <div class="field">
          <label>Até</label>
          <input type="date" id="rel_ate">
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <label style="font-weight:400;font-size:13px;"><input type="checkbox" id="rel_agrupar" onchange="renderRelatorio()"> Agrupar por prestador</label>
        </div>
        <button class="btn" onclick="carregarRelatorio()">Buscar</button>
        <button class="btn secondary" onclick="setSemanaAtual()">Semana atual</button>
        <button class="btn secondary" onclick="gerarRelatorioSemanal()">📄 Relatório para PIX</button>
      </div>
      <div class="metrics-grid" id="relatorioMetrics"></div>
      <div id="relatorioBody"></div>
    </section>

    <!-- EQUIPE (admin) -->
    <section class="tab-panel" id="tab-equipe">
      <form class="form-grid" id="equipeForm" style="margin-bottom:20px;">
        <div class="field">
          <label>Nome do novo usuário *</label>
          <input type="text" id="eq_nome" required placeholder="Ex: RICARDO">
        </div>
        <div class="field">
          <label>Tipo de acesso *</label>
          <select id="eq_role">
            <option value="funcionario">Funcionário (só lança saídas)</option>
            <option value="admin">Administrador (acesso total)</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn">Criar Usuário</button>
        </div>
      </form>
      <div class="success-banner" id="equipeBanner"><span id="equipeText"></span><button class="btn secondary small" onclick="document.getElementById('equipeBanner').classList.remove('show')">Fechar</button></div>
      <div id="equipeListBody"></div>
    </section>
  </main>
</div>

<!-- RECIBO PRINT AREA (visually hidden on screen, only shown during print) -->
<div id="receiptPrintArea"></div>

<!-- MODAL DE PRÉVIA DO RECIBO -->
<div id="reciboModalOverlay" class="no-print" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:100;">
  <div style="background:#fff;border-radius:10px;max-width:780px;width:100%;padding:20px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <h3 style="margin:0;">Prévia do recibo</h3>
      <div>
        <button class="btn" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
        <button class="btn secondary" onclick="document.getElementById('reciboModalOverlay').style.display='none'">Fechar</button>
      </div>
    </div>
    <div id="reciboPreviewInner"></div>
  </div>
</div>

/* ==================== HELPERS ==================== */
function pad(n,len){ return String(n).padStart(len,'0'); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2); }
function formatCurrency(n){ return (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function formatDateBR(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }
function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
const PAGADOR_LABEL = { Proprietario:'Proprietário', Locatario:'Locatário', Imobiliaria:'Imobiliária' };

/* ---- valor por extenso (pt-BR) ---- */
const UNI = ['','um','dois','três','quatro','cinco','seis','sete','oito','nove'];
const DEZ19 = ['dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
const DEZENA = ['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
const CENT = ['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
function centenaExtenso(n){
  if(n===0) return '';
  if(n===100) return 'cem';
  const c=Math.floor(n/100), resto=n%100, d=Math.floor(resto/10), u=resto%10;
  const partes=[];
  if(c>0) partes.push(CENT[c]);
  if(resto>=10 && resto<=19) partes.push(DEZ19[resto-10]);
  else{
    if(d>0) partes.push(DEZENA[d]);
    if(u>0) partes.push(UNI[u]);
  }
  return partes.join(' e ');
}
function numeroExtenso(n){
  if(n===0) return 'zero';
  const milhoes=Math.floor(n/1000000), milhares=Math.floor((n%1000000)/1000), centenas=n%1000;
  const partes=[];
  if(milhoes>0) partes.push(centenaExtenso(milhoes) + (milhoes===1?' milhão':' milhões'));
  if(milhares>0) partes.push(milhares===1 ? 'mil' : centenaExtenso(milhares)+' mil');
  if(centenas>0) partes.push(centenaExtenso(centenas));
  return partes.join(' e ');
}
function valorPorExtenso(valor){
  valor = Math.round(valor*100)/100;
  const inteiro = Math.floor(valor);
  const centavos = Math.round((valor-inteiro)*100);
  let txt = inteiro===0 ? 'zero reais' : (numeroExtenso(inteiro) + (inteiro===1 ? ' real' : ' reais'));
  if(centavos>0){
    txt += ' e ' + numeroExtenso(centavos) + (centavos===1 ? ' centavo' : ' centavos');
  }
  return txt;
}
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function dataExtensoBR(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return d+' de '+MESES[m-1]+' de '+y;
}

/* ==================== AUTH ==================== */
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const usuario = document.getElementById('l_usuario').value.trim();
  const senha = document.getElementById('l_senha').value;
  const errEl = document.getElementById('loginError');
  errEl.classList.remove('show');
  try{
    await signInWithEmailAndPassword(auth, usernameToEmail(usuario), senha);
  }catch(err){
    errEl.textContent = 'Usuário ou senha inválidos.';
    errEl.classList.add('show');
  }
});

window.doLogout = function(){ signOut(auth); };

onAuthStateChanged(auth, async (user)=>{
  if(user){
    const snap = await getDoc(doc(db,'usuarios',user.uid));
    if(!snap.exists()){
      document.getElementById('loginError').textContent = 'Usuário sem permissão configurada. Fale com o administrador.';
      document.getElementById('loginError').classList.add('show');
      signOut(auth);
      return;
    }
    const data = snap.data();
    currentUser = { uid:user.uid, username:data.username, role:data.role };
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    document.getElementById('whoName').textContent = currentUser.username;
    document.getElementById('whoRole').textContent = currentUser.role==='admin' ? 'Admin' : 'Funcionário';
    document.querySelectorAll('.admin-only').forEach(el=> el.style.display = currentUser.role==='admin' ? '' : 'none');
    document.getElementById('f_data').value = todayISO();
    loadMeusLancamentos();
    loadPrestadoresDatalist();
  } else {
    currentUser = null;
    document.getElementById('appScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('loginForm').reset();
  }
});

/* ==================== TABS ==================== */
window.switchTab = function(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('.tab-panel').forEach(s=>s.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='meus') loadMeusLancamentos();
  if(name==='relatorio' && !document.getElementById('rel_de').value) setSemanaAtual();
  if(name==='equipe') loadEquipeList();
};

/* ==================== LANÇAMENTO ==================== */
document.getElementById('lancForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const payload = {
    prestador: document.getElementById('f_prestador').value.trim(),
    imovel: document.getElementById('f_imovel').value.trim(),
    pagador: document.getElementById('f_pagador').value,
    pagadorNome: document.getElementById('f_pagadorNome').value.trim(),
    data: document.getElementById('f_data').value,
    valorPago: parseFloat(document.getElementById('f_valorPago').value)||0,
    valorCobrado: parseFloat(document.getElementById('f_valorCobrado').value)||0,
    descricao: document.getElementById('f_descricao').value.trim(),
    descricaoNota: document.getElementById('f_descricaoNota').value.trim()
  };
  const editingId = document.getElementById('editingId').value;
  try{
    if(editingId){
      await updateDoc(doc(db,'lancamentos',editingId), payload);
      showSuccess('Lançamento atualizado com sucesso.');
    } else {
      payload.criadoPor = currentUser.uid;
      payload.criadoPorNome = currentUser.username;
      payload.criadoEm = new Date().toISOString();
      await addDoc(collection(db,'lancamentos'), payload);
      showSuccess('Saída registrada com sucesso.');
    }
    resetLancForm();
    loadMeusLancamentos();
    loadPrestadoresDatalist();
  }catch(err){
    alert('Erro ao salvar: ' + err.message);
  }
});

function showSuccess(text){
  const banner = document.getElementById('successBanner');
  document.getElementById('successText').textContent = '✅ ' + text;
  banner.classList.add('show');
}
window.dismissSuccess = function(){ document.getElementById('successBanner').classList.remove('show'); };

window.resetLancForm = function(){
  document.getElementById('lancForm').reset();
  document.getElementById('editingId').value = '';
  document.getElementById('submitBtn').textContent = 'Registrar Saída';
  document.getElementById('f_data').value = todayISO();
};

async function loadPrestadoresDatalist(){
  try{
    const q = query(collection(db,'lancamentos'), where('criadoPor','==',currentUser.uid));
    const snap = await getDocs(q);
    const nomes = new Set();
    snap.forEach(d=> nomes.add(d.data().prestador));
    const dl = document.getElementById('prestadoresList');
    dl.innerHTML = Array.from(nomes).map(n=>`<option value="${escapeHtml(n)}">`).join('');
  }catch(e){}
}

/* ==================== MEUS LANÇAMENTOS ==================== */
async function loadMeusLancamentos(){
  const body = document.getElementById('meusLancamentosBody');
  body.innerHTML = '<p style="color:var(--muted);">Carregando...</p>';
  try{
    const q = query(collection(db,'lancamentos'), where('criadoPor','==',currentUser.uid));
    const snap = await getDocs(q);
    let items = [];
    snap.forEach(d=> items.push({ id:d.id, ...d.data() }));
    items.sort((a,b)=> (b.criadoEm||'').localeCompare(a.criadoEm||''));
    items = items.slice(0,50);
    if(items.length===0){
      body.innerHTML = '<div class="empty-state"><div class="big">📋</div><p>Nenhum lançamento registrado ainda.</p></div>';
      return;
    }
    body.innerHTML = `<table class="report-table"><thead><tr>
      <th>Data</th><th>Prestador</th><th>Imóvel</th><th>Pagador</th><th>Pago</th><th>Cobrado</th><th>Descrição</th><th></th>
    </tr></thead><tbody>
      ${items.map(it=>`<tr>
        <td>${formatDateBR(it.data)}</td>
        <td>${escapeHtml(it.prestador)}</td>
        <td>${escapeHtml(it.imovel)||'—'}</td>
        <td><span class="badge pagador-${it.pagador}">${PAGADOR_LABEL[it.pagador]||it.pagador}</span></td>
        <td>${formatCurrency(it.valorPago)}</td>
        <td>${formatCurrency(it.valorCobrado)}</td>
        <td>${escapeHtml(it.descricao)}</td>
        <td class="row-actions">
          <button class="btn secondary small" onclick="editarLancamento('${it.id}')">✏️</button>
          <button class="btn danger small" onclick="excluirLancamento('${it.id}')">🗑</button>
        </td>
      </tr>`).join('')}
    </tbody></table>`;
    window._meusCache = items;
  }catch(e){
    body.innerHTML = '<div class="empty-state"><p>Erro ao carregar: '+escapeHtml(e.message)+'</p></div>';
  }
}

window.editarLancamento = function(id){
  const it = (window._meusCache||[]).find(x=>x.id===id) || (window._relCache||[]).find(x=>x.id===id);
  if(!it) return;
  switchTab('lancar');
  document.getElementById('editingId').value = id;
  document.getElementById('f_prestador').value = it.prestador;
  document.getElementById('f_imovel').value = it.imovel;
  document.getElementById('f_pagador').value = it.pagador;
  document.getElementById('f_pagadorNome').value = it.pagadorNome||'';
  document.getElementById('f_data').value = it.data;
  document.getElementById('f_valorPago').value = it.valorPago;
  document.getElementById('f_valorCobrado').value = it.valorCobrado;
  document.getElementById('f_descricao').value = it.descricao;
  document.getElementById('f_descricaoNota').value = it.descricaoNota||'';
  document.getElementById('submitBtn').textContent = 'Salvar Alterações';
};

window.excluirLancamento = async function(id){
  if(!confirm('Excluir este lançamento? Essa ação não pode ser desfeita.')) return;
  try{
    await deleteDoc(doc(db,'lancamentos',id));
    loadMeusLancamentos();
    if(document.getElementById('tab-relatorio').classList.contains('active')) carregarRelatorio();
  }catch(e){ alert('Erro ao excluir: '+e.message); }
};

/* ==================== RELATÓRIO (ADMIN) ==================== */
window.setSemanaAtual = function(){
  const hoje = new Date();
  const diaSemana = hoje.getDay(); // 0=dom
  const seg = new Date(hoje); seg.setDate(hoje.getDate() - ((diaSemana+6)%7));
  const sex = new Date(seg); sex.setDate(seg.getDate()+4);
  document.getElementById('rel_de').value = seg.getFullYear()+'-'+pad(seg.getMonth()+1,2)+'-'+pad(seg.getDate(),2);
  document.getElementById('rel_ate').value = sex.getFullYear()+'-'+pad(sex.getMonth()+1,2)+'-'+pad(sex.getDate(),2);
  carregarRelatorio();
};

window.carregarRelatorio = async function(){
  const de = document.getElementById('rel_de').value;
  const ate = document.getElementById('rel_ate').value;
  const body = document.getElementById('relatorioBody');
  if(!de || !ate){ body.innerHTML = '<p style="color:var(--muted);">Escolha o período.</p>'; return; }
  body.innerHTML = '<p style="color:var(--muted);">Carregando...</p>';
  try{
    const q = query(collection(db,'lancamentos'), where('data','>=',de), where('data','<=',ate), orderBy('data','asc'));
    const snap = await getDocs(q);
    let items = [];
    snap.forEach(d=> items.push({ id:d.id, ...d.data() }));
    window._relCache = items;
    renderRelatorio();
  }catch(e){
    body.innerHTML = '<div class="empty-state"><p>Erro ao carregar: '+escapeHtml(e.message)+'</p></div>';
  }
};

window.renderRelatorio = function(){
  const items = window._relCache || [];
  const body = document.getElementById('relatorioBody');
  const metrics = document.getElementById('relatorioMetrics');
  const totalPago = items.reduce((s,i)=>s+i.valorPago,0);
  const totalCobrado = items.reduce((s,i)=>s+i.valorCobrado,0);
  const totalLucro = totalCobrado - totalPago;
  metrics.innerHTML = `
    <div class="metric-card"><div class="val">${items.length}</div><div class="lbl">📋 Lançamentos</div></div>
    <div class="metric-card"><div class="val">${formatCurrency(totalCobrado)}</div><div class="lbl">💰 Total cobrado</div></div>
    <div class="metric-card"><div class="val">${formatCurrency(totalPago)}</div><div class="lbl">👷 Total pago</div></div>
    <div class="metric-card"><div class="val" style="color:${totalLucro>=0?'var(--pos)':'var(--neg)'}">${formatCurrency(totalLucro)}</div><div class="lbl">🏢 Lucro</div></div>
  `;
  if(items.length===0){
    body.innerHTML = '<div class="empty-state"><div class="big">📊</div><p>Nenhum lançamento no período.</p></div>';
    return;
  }
  const agrupar = document.getElementById('rel_agrupar').checked;
  function linhaHtml(it){
    return `<tr>
      <td>${formatDateBR(it.data)}</td>
      <td>${escapeHtml(it.prestador)}</td>
      <td>${escapeHtml(it.imovel)||'—'}</td>
      <td><span class="badge pagador-${it.pagador}">${PAGADOR_LABEL[it.pagador]||it.pagador}</span></td>
      <td>${formatCurrency(it.valorPago)}</td>
      <td>${formatCurrency(it.valorCobrado)}</td>
      <td class="${(it.valorCobrado-it.valorPago)>=0?'val-pos':'val-neg'}">${formatCurrency(it.valorCobrado-it.valorPago)}</td>
      <td>${escapeHtml(it.descricao)}</td>
      <td>${escapeHtml(it.criadoPorNome)||'—'}</td>
      <td class="row-actions">
        <button class="btn secondary small" onclick="gerarRecibo('${it.id}')">🧾 Recibo</button>
        <button class="btn secondary small" onclick="gerarNotaServico('${it.id}')">📝 Nota</button>
        <button class="btn secondary small" onclick="editarLancamento('${it.id}')">✏️</button>
        <button class="btn danger small" onclick="excluirLancamento('${it.id}')">🗑</button>
      </td>
    </tr>`;
  }
  const head = `<tr><th>Data</th><th>Prestador</th><th>Imóvel</th><th>Pagador</th><th>Pago</th><th>Cobrado</th><th>Lucro</th><th>Descrição</th><th>Lançado por</th><th></th></tr>`;
  let rows = '';
  if(agrupar){
    const grupos = {};
    items.forEach(it=>{ (grupos[it.prestador] = grupos[it.prestador]||[]).push(it); });
    Object.keys(grupos).sort().forEach(prestador=>{
      const lista = grupos[prestador];
      const subPago = lista.reduce((s,i)=>s+i.valorPago,0);
      const subCobrado = lista.reduce((s,i)=>s+i.valorCobrado,0);
      rows += lista.map(linhaHtml).join('');
      rows += `<tr class="subtotal"><td colspan="4">Subtotal — ${escapeHtml(prestador)}</td><td>${formatCurrency(subPago)}</td><td>${formatCurrency(subCobrado)}</td><td>${formatCurrency(subCobrado-subPago)}</td><td colspan="3"></td></tr>`;
    });
  } else {
    rows = items.map(linhaHtml).join('');
  }
  body.innerHTML = `<div style="overflow-x:auto;"><table class="report-table"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
};

/* ==================== GERAR RECIBO ==================== */
function montarReciboHtml(it){
  const valorTxt = formatCurrency(it.valorCobrado);
  const extenso = valorPorExtenso(it.valorCobrado);
  const dataTxt = dataExtensoBR(it.data);
  const imovelLinha = it.imovel ? `<p><b>ENDEREÇO DO IMÓVEL:</b> ${escapeHtml(it.imovel)}</p>` : '';
  return `<div class="recibo-box">
      <div class="r-header">
        <img src="${LOGO_B64}">
        <h1>RECIBO DE PRESTAÇÃO DE SERVIÇO</h1>
      </div>
      <p>Eu, <b>${escapeHtml(it.prestador.toUpperCase())}</b>, declaro para todos os fins que recebi da IMOBILIÁRIA CASA BLANCA, a quantia de ${valorTxt} (${extenso}) referente aos serviços de ${escapeHtml(it.descricao)}.</p>
      ${imovelLinha}
      <p class="data-linha">Iguatu, ${dataTxt}.</p>
      <div class="assinatura">
        <div class="linha"></div>
        <p style="margin-top:6px;">PRESTADOR(A) DO SERVIÇO</p>
      </div>
    </div>`;
}
function abrirPreviaImpressao(html){
  document.getElementById('receiptPrintArea').innerHTML = html;
  document.getElementById('reciboPreviewInner').innerHTML = html;
  document.getElementById('reciboModalOverlay').style.display = 'flex';
}
window.gerarRecibo = function(id){
  const it = (window._relCache||[]).find(x=>x.id===id);
  if(!it) return;
  abrirPreviaImpressao(montarReciboHtml(it));
};

/* ==================== GERAR NOTA DE SERVIÇO ==================== */
const PAGADOR_ORDEM = ['Proprietario','Locatario','Imobiliaria'];
const PAGADOR_SIGLA = { Proprietario:'Prop.', Locatario:'Loct.', Imobiliaria:'Imob.' };
function montarNotaServicoHtml(it){
  const descNota = it.descricaoNota ? it.descricaoNota : it.descricao;
  const linhasPagador = PAGADOR_ORDEM.map(p=>{
    const marcado = p===it.pagador;
    const nome = (marcado && it.pagadorNome) ? ` — ${escapeHtml(it.pagadorNome)}` : '';
    return `<tr><td style="width:26px;text-align:center;font-weight:700;">${marcado?'X':''}</td><td><b>${PAGADOR_SIGLA[p]}</b>${nome}</td></tr>`;
  }).join('');
  return `<div class="recibo-box" style="max-width:600px;">
      <div class="r-header">
        <img src="${LOGO_B64}">
        <h1>NOTAS DE SERVIÇO</h1>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:14px;">
        <tr><td style="padding:6px 0;"><b>Prestador:</b> ${escapeHtml(it.prestador)}</td></tr>
        <tr><td style="padding:6px 0;"><b>Imóvel:</b> ${escapeHtml(it.imovel)||'—'}</td></tr>
        <tr><td style="padding:6px 0;"><b>Serviço:</b> ${escapeHtml(descNota)}</td></tr>
      </table>
      <table style="width:100%;border-collapse:collapse;font-size:14px;margin-top:14px;border:1px solid #000;">
        <tr>
          <th style="border:1px solid #000;padding:8px;text-align:left;">DESCRIÇÃO</th>
          <th style="border:1px solid #000;padding:8px;width:130px;">VALOR R$</th>
        </tr>
        <tr>
          <td style="border:1px solid #000;padding:8px;min-height:60px;">${escapeHtml(descNota)}</td>
          <td style="border:1px solid #000;padding:8px;text-align:right;">${formatCurrency(it.valorPago)}</td>
        </tr>
        <tr>
          <td style="border:1px solid #000;padding:8px;text-align:right;"><b>TOTAL</b></td>
          <td style="border:1px solid #000;padding:8px;text-align:right;"><b>${formatCurrency(it.valorPago)}</b></td>
        </tr>
      </table>
      <table style="width:100%;border-collapse:collapse;font-size:14px;margin-top:14px;border:1px solid #000;">
        <tr><th colspan="2" style="border:1px solid #000;padding:6px;">PAGADOR</th></tr>
        ${linhasPagador}
      </table>
      <p class="data-linha" style="text-align:left;margin-top:14px;"><b>Data:</b> ${formatDateBR(it.data)}</p>
    </div>`;
}
window.gerarNotaServico = function(id){
  const it = (window._relCache||[]).find(x=>x.id===id) || (window._meusCache||[]).find(x=>x.id===id);
  if(!it) return;
  abrirPreviaImpressao(montarNotaServicoHtml(it));
};

/* ==================== RELATÓRIO SEMANAL (PARA PIX) ==================== */
window.gerarRelatorioSemanal = function(){
  const items = window._relCache || [];
  const de = document.getElementById('rel_de').value;
  const ate = document.getElementById('rel_ate').value;
  if(items.length===0){
    alert('Não há lançamentos no período selecionado. Clique em "Buscar" primeiro.');
    return;
  }
  const porPrestador = {};
  items.forEach(it=>{
    if(!porPrestador[it.prestador]) porPrestador[it.prestador] = { valorPago:0, qtd:0 };
    porPrestador[it.prestador].valorPago += it.valorPago;
    porPrestador[it.prestador].qtd += 1;
  });
  const nomes = Object.keys(porPrestador).sort();
  const totalGeral = nomes.reduce((s,n)=>s+porPrestador[n].valorPago,0);

  const linhas = nomes.map(n=>`
    <tr>
      <td style="border:1px solid #000;padding:8px;">${escapeHtml(n)}</td>
      <td style="border:1px solid #000;padding:8px;text-align:center;">${porPrestador[n].qtd}</td>
      <td style="border:1px solid #000;padding:8px;text-align:right;">${formatCurrency(porPrestador[n].valorPago)}</td>
    </tr>`).join('');

  const html = `<div class="recibo-box" style="max-width:680px;">
      <div class="r-header">
        <img src="${LOGO_B64}">
        <h1>RELATÓRIO SEMANAL — PAGAMENTOS</h1>
      </div>
      <p style="text-align:center;margin-top:-6px;">Período: <b>${formatDateBR(de)} a ${formatDateBR(ate)}</b></p>
      <table style="width:100%;border-collapse:collapse;font-size:14px;margin-top:10px;border:1px solid #000;">
        <tr>
          <th style="border:1px solid #000;padding:8px;text-align:left;">PRESTADOR</th>
          <th style="border:1px solid #000;padding:8px;width:90px;">SERVIÇOS</th>
          <th style="border:1px solid #000;padding:8px;width:150px;">VALOR A PAGAR</th>
        </tr>
        ${linhas}
        <tr>
          <td style="border:1px solid #000;padding:8px;text-align:right;" colspan="2"><b>TOTAL GERAL</b></td>
          <td style="border:1px solid #000;padding:8px;text-align:right;"><b>${formatCurrency(totalGeral)}</b></td>
        </tr>
      </table>
      <p style="font-size:12px;color:#555;margin-top:14px;">Valores referentes ao pagamento dos prestadores (PIX). Gerado em ${formatDateBR(todayISO())}.</p>
    </div>`;
  abrirPreviaImpressao(html);
};

/* ==================== EQUIPE (ADMIN) ==================== */
document.getElementById('equipeForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const nomeRaw = document.getElementById('eq_nome').value.trim();
  const role = document.getElementById('eq_role').value;
  if(!nomeRaw) return;
  const username = nomeRaw.toUpperCase();
  const password = username.length < 6 ? username + '01' : username;
  const email = usernameToEmail(username);
  try{
    const secondaryApp = initializeApp(firebaseConfig, 'secondary-' + Date.now());
    const secondaryAuth = getAuth(secondaryApp);
    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
    const newUid = cred.user.uid;
    await signOut(secondaryAuth);
    await deleteApp(secondaryApp);
    await setDoc(doc(db,'usuarios',newUid), { username, role });
    document.getElementById('equipeText').textContent = `✅ Criado! Usuário: ${username}  |  Senha: ${password}  |  Tipo: ${role==='admin'?'Administrador':'Funcionário'}`;
    document.getElementById('equipeBanner').classList.add('show');
    document.getElementById('equipeForm').reset();
    loadEquipeList();
  }catch(err){
    alert('Erro ao criar usuário: ' + err.message);
  }
});

async function loadEquipeList(){
  const body = document.getElementById('equipeListBody');
  body.innerHTML = '<p style="color:var(--muted);">Carregando...</p>';
  try{
    const snap = await getDocs(collection(db,'usuarios'));
    let items = [];
    snap.forEach(d=> items.push({ id:d.id, ...d.data() }));
    items.sort((a,b)=> (a.username||'').localeCompare(b.username||''));
    body.innerHTML = `<table class="report-table"><thead><tr><th>Usuário</th><th>Tipo</th></tr></thead><tbody>
      ${items.map(it=>`<tr><td>${escapeHtml(it.username)}</td><td>${it.role==='admin'?'Administrador':'Funcionário'}</td></tr>`).join('')}
    </tbody></table>`;
  }catch(e){
    body.innerHTML = '<p style="color:var(--muted);">Erro ao carregar equipe.</p>';
  }
}
